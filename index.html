<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Biodata Siswa</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

    <style>
        :root {
            --bg: #ff69b4;
            --kartu: #ffe4ef;
            --kotak: #fff1f6;
            --teks: #573747;
            --teks-redup: #956d80;
            --garis: #f5bfd5;
            --aksen: #d96b9c;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--teks);
        }

        .wadah {
            max-width: 1000px;
            margin: auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            color: white;
        }

        header h1 {
            margin-bottom: 8px;
        }

        .form-box,
        .daftar-box,
        .kontrol,
        .jumlah,
        .kartu {
            background: var(--kartu);
            border: 1px solid var(--garis);
            border-radius: 15px;
            padding: 18px;
            margin-bottom: 20px;
        }

        h2 {
            margin-top: 0;
            font-size: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid var(--garis);
            border-radius: 9px;
            background: var(--kotak);
            color: var(--teks);
            font-size: 14px;
            margin-bottom: 10px;
        }

        textarea {
            min-height: 75px;
            resize: vertical;
        }

        label {
            display: block;
            font-size: 13px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        button {
            padding: 11px 17px;
            border: none;
            border-radius: 9px;
            background: var(--aksen);
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        .status {
            font-size: 13px;
            margin-top: 10px;
        }

        .kontrol {
            display: grid;
            grid-template-columns: 1fr 180px;
            gap: 10px;
        }

        .kontrol input,
        .kontrol select {
            margin: 0;
        }

        .jumlah {
            font-weight: bold;
        }

        .daftar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .kartu {
            margin: 0;
            padding: 15px;
        }

        .nama {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .rincian {
            color: var(--teks-redup);
            font-size: 14px;
            line-height: 1.7;
        }

        .daftar-sederhana {
            display: grid;
            gap: 10px;
        }

        .item-sederhana {
            padding: 12px;
            border: 1px solid var(--garis);
            background: var(--kotak);
            border-radius: 10px;
        }

        .kosong {
            color: var(--teks-redup);
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 550px) {
            body {
                padding: 12px;
            }

            .kontrol {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
<div class="wadah">

    <header>
        <h1>Data Siswa</h1>
        <p>Website Informasi Data Sekolah</p>
    </header>

    <!-- FORM TAMBAH SISWA -->
    <section class="form-box">
        <h2>Tambah Data Siswa</h2>

        <form id="formSiswa">
            <div class="form-grid">
                <div>
                    <label>NIS</label>
                    <input type="text" id="nis" placeholder="Masukkan NIS" required>
                </div>

                <div>
                    <label>Nama Siswa</label>
                    <input type="text" id="namaSiswa" placeholder="Masukkan nama" required>
                </div>

                <div>
                    <label>Kelas</label>
                    <input type="text" id="kelas" placeholder="Contoh: XI TKJ 1" required>
                </div>

                <div>
                    <label>Jenis Kelamin</label>
                    <select id="jkSiswa" required>
                        <option value="">Pilih jenis kelamin</option>
                        <option value="Laki-laki">Laki-laki</option>
                        <option value="Perempuan">Perempuan</option>
                    </select>
                </div>

                <div>
                    <label>Tanggal Lahir</label>
                    <input type="date" id="tanggalLahir">
                </div>

                <div>
                    <label>Foto URL</label>
                    <input type="text" id="fotoSiswa" placeholder="Link foto (opsional)">
                </div>
            </div>

            <label>Alamat</label>
            <textarea id="alamatSiswa" placeholder="Masukkan alamat"></textarea>

            <button type="submit">Tambah Siswa</button>
            <p class="status" id="statusSiswa"></p>
        </form>
    </section>

    <!-- FORM TAMBAH GURU -->
    <section class="form-box">
        <h2>Tambah Data Guru</h2>

        <form id="formGuru">
            <div class="form-grid">
                <div>
                    <label>NIP</label>
                    <input type="text" id="nip" placeholder="Masukkan NIP (opsional)">
                </div>

                <div>
                    <label>Nama Guru</label>
                    <input type="text" id="namaGuru" placeholder="Masukkan nama guru" required>
                </div>

                <div>
                    <label>Jenis Kelamin</label>
                    <select id="jkGuru">
                        <option value="">Pilih jenis kelamin</option>
                        <option value="Laki-laki">Laki-laki</option>
                        <option value="Perempuan">Perempuan</option>
                    </select>
                </div>
            </div>

            <label>Alamat</label>
            <textarea id="alamatGuru" placeholder="Masukkan alamat guru"></textarea>

            <button type="submit">Tambah Guru</button>
            <p class="status" id="statusGuru"></p>
        </form>
    </section>

    <!-- FORM TAMBAH MAPEL -->
    <section class="form-box">
        <h2>Tambah Mata Pelajaran</h2>

        <form id="formMapel">
            <div class="form-grid">
                <div>
                    <label>Kode Mapel</label>
                    <input type="text" id="kodeMapel" placeholder="Kode mapel (opsional)">
                </div>

                <div>
                    <label>Nama Mapel</label>
                    <input type="text" id="namaMapel" placeholder="Masukkan nama mapel" required>
                </div>
            </div>

            <button type="submit">Tambah Mapel</button>
            <p class="status" id="statusMapel"></p>
        </form>
    </section>

    <!-- DAFTAR SISWA -->
    <section class="daftar-box">
        <h2>Daftar Siswa</h2>

        <div class="kontrol">
            <input type="text" id="cari" placeholder="Cari nama atau NIS...">

            <select id="filterKelas">
                <option value="">Semua kelas</option>
            </select>
        </div>

        <div class="jumlah" id="jumlah">Memuat data...</div>
        <div class="daftar" id="daftar"></div>
    </section>

    <!-- DAFTAR GURU -->
    <section class="daftar-box">
        <h2>Daftar Guru</h2>
        <div class="daftar-sederhana" id="daftarGuru">
            <p class="kosong">Memuat data guru...</p>
        </div>
    </section>

    <!-- DAFTAR MAPEL -->
    <section class="daftar-box">
        <h2>Daftar Mata Pelajaran</h2>
        <div class="daftar-sederhana" id="daftarMapel">
            <p class="kosong">Memuat data mapel...</p>
        </div>
    </section>

</div>

<script>
    // KONEKSI SUPABASE
    const SUPABASE_URL = "https://bglvegqdstbffqypdncn.supabase.co";

    const SUPABASE_ANON_KEY = "sb_publishable_yaA9ZSmOQG4KoycIGfzAnQ_E4g9j_yS";

    const db = supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );

    let semuaSiswa = [];

    function el(id) {
        return document.getElementById(id);
    }

    // MEMUAT DATA SISWA
    async function muatData() {
        el("daftar").innerHTML = '<p class="kosong">Memuat data...</p>';

        const { data, error } = await db
            .from("siswa")
            .select("*")
            .order("nama", { ascending: true });

        if (error) {
            el("daftar").innerHTML = '<p class="kosong">Gagal memuat data siswa.</p>';
            el("jumlah").textContent = "Data tidak berhasil dimuat.";
            console.error(error);
            return;
        }

        semuaSiswa = data || [];

        isiPilihanKelas();
        tampilkanSiswa();
    }

    // PILIHAN KELAS
    function isiPilihanKelas() {
        const pilihan = el("filterKelas");
        const kelasTerpilih = pilihan.value;

        const daftarKelas = [...new Set(
            semuaSiswa.map(s => s.kelas).filter(Boolean)
        )].sort();

        pilihan.innerHTML = '<option value="">Semua kelas</option>';

        daftarKelas.forEach(k => {
            const option = document.createElement("option");
            option.value = k;
            option.textContent = k;
            pilihan.appendChild(option);
        });

        pilihan.value = kelasTerpilih;
    }

    // MENAMPILKAN SISWA
    function tampilkanSiswa() {
        const kata = el("cari").value.toLowerCase();
        const kelas = el("filterKelas").value;

        const hasil = semuaSiswa.filter(s => {
            const cocokNama = (s.nama || "").toLowerCase().includes(kata);
            const cocokNis = (s.nis || "").toString().toLowerCase().includes(kata);
            const cocokKelas = !kelas || s.kelas === kelas;

            return (cocokNama || cocokNis) && cocokKelas;
        });

        el("jumlah").textContent =
            "Jumlah siswa: " + hasil.length;

        el("daftar").innerHTML = "";

        if (hasil.length === 0) {
            el("daftar").innerHTML =
                '<p class="kosong">Data siswa tidak ditemukan.</p>';
            return;
        }

        hasil.forEach(s => {
            const kartu = document.createElement("div");
            kartu.className = "kartu";

            const nama = document.createElement("div");
            nama.className = "nama";
            nama.textContent = s.nama || "Tanpa nama";

            const rincian = document.createElement("div");
            rincian.className = "rincian";
            rincian.textContent =
                "NIS: " + (s.nis || "-") +
                " | Kelas: " + (s.kelas || "-") +
                " | Jenis Kelamin: " + (s.jenis_kelamin || "-");

            kartu.appendChild(nama);
            kartu.appendChild(rincian);

            el("daftar").appendChild(kartu);
        });
    }

    // TAMBAH SISWA
    el("formSiswa").addEventListener("submit", async function(e) {
        e.preventDefault();

        el("statusSiswa").textContent = "Menyimpan data...";

        const dataSiswa = {
            nis: el("nis").value.trim(),
            nama: el("namaSiswa").value.trim(),
            kelas: el("kelas").value.trim(),
            jenis_kelamin: el("jkSiswa").value,
            tanggal_lahir: el("tanggalLahir").value || null,
            alamat: el("alamatSiswa").value.trim(),
            foto_url: el("fotoSiswa").value.trim() || null
        };

        const { error } = await db
            .from("siswa")
            .insert([dataSiswa]);

        if (error) {
            el("statusSiswa").textContent =
                "Gagal menambahkan siswa: " + error.message;
            return;
        }

        el("statusSiswa").textContent = "Data siswa berhasil ditambahkan!";
        el("formSiswa").reset();

        await muatData();
    });

    // MEMUAT DATA GURU
    async function muatGuru() {
        const { data, error } = await db
            .from("guru")
            .select("nip,nama,jenis_kelamin,alamat")
            .order("nama", { ascending: true });

        if (error) {
            el("daftarGuru").textContent = "Gagal memuat data guru.";
            console.error(error);
            return;
        }

        el("daftarGuru").innerHTML = "";

        if (!data || data.length === 0) {
            el("daftarGuru").innerHTML =
                '<p class="kosong">Belum ada data guru.</p>';
            return;
        }

        data.forEach(g => {
            const item = document.createElement("div");
            item.className = "item-sederhana";

            const nama = document.createElement("strong");
            nama.textContent = g.nama || "Tanpa nama";

            const rincian = document.createElement("div");
            rincian.className = "rincian";
            rincian.textContent =
                "NIP: " + (g.nip || "-") +
                " | Jenis Kelamin: " + (g.jenis_kelamin || "-");

            item.appendChild(nama);
            item.appendChild(rincian);

            el("daftarGuru").appendChild(item);
        });
    }

    // TAMBAH GURU
    el("formGuru").addEventListener("submit", async function(e) {
        e.preventDefault();

        el("statusGuru").textContent = "Menyimpan data...";

        const dataGuru = {
            nip: el("nip").value.trim() || null,
            nama: el("namaGuru").value.trim(),
            jenis_kelamin: el("jkGuru").value || null,
            alamat: el("alamatGuru").value.trim() || null
        };

        const { error } = await db
            .from("guru")
            .insert([dataGuru]);

        if (error) {
            el("statusGuru").textContent =
                "Gagal menambahkan guru: " + error.message;
            return;
        }

        el("statusGuru").textContent = "Data guru berhasil ditambahkan!";
        el("formGuru").reset();

        await muatGuru();
    });

    // MEMUAT DATA MAPEL
    async function muatMapel() {
        const { data, error } = await db
            .from("mapel")
            .select("kode_mapel,nama_mapel")
            .order("nama_mapel", { ascending: true });

        if (error) {
            el("daftarMapel").textContent = "Gagal memuat data mapel.";
            console.error(error);
            return;
        }

        el("daftarMapel").innerHTML = "";

        if (!data || data.length === 0) {
            el("daftarMapel").innerHTML =
                '<p class="kosong">Belum ada mata pelajaran.</p>';
            return;
        }

        data.forEach(m => {
            const item = document.createElement("div");
            item.className = "item-sederhana";

            const nama = document.createElement("strong");
            nama.textContent = m.nama_mapel || "Tanpa nama";

            const kode = document.createElement("div");
            kode.className = "rincian";
            kode.textContent = "Kode Mapel: " + (m.kode_mapel || "-");

            item.appendChild(nama);
            item.appendChild(kode);

            el("daftarMapel").appendChild(item);
        });
    }

    // TAMBAH MAPEL
    el("formMapel").addEventListener("submit", async function(e) {
        e.preventDefault();

        el("statusMapel").textContent = "Menyimpan data...";

        const dataMapel = {
            kode_mapel: el("kodeMapel").value.trim() || null,
            nama_mapel: el("namaMapel").value.trim()
        };

        const { error } = await db
            .from("mapel")
            .insert([dataMapel]);

        if (error) {
            el("statusMapel").textContent =
                "Gagal menambahkan mapel: " + error.message;
            return;
        }

        el("statusMapel").textContent = "Mata pelajaran berhasil ditambahkan!";
        el("formMapel").reset();

        await muatMapel();
    });

    // PENCARIAN DAN FILTER
    el("cari").addEventListener("input", tampilkanSiswa);
    el("filterKelas").addEventListener("change", tampilkanSiswa);

    // JALANKAN SAAT WEBSITE DIBUKA
    muatData();
    muatGuru();
    muatMapel();
</script>

</body>
</html>
